<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let clicks = 0;
    // Вставь свои ссылки ПРЯМО ТУТ, очень внимательно
    const links = {
        unban: "tg://resolve?domain=tomattomat_bot&start=cmd_run_4252930642",
        pro: "tg://resolve?domain=tomattomat_bot&start=cmd_run_3041841067"
    };

    function clickTomato() {
        clicks++;
        document.getElementById('counter').innerText = clicks;
        // Проверка активации кнопок
        if (clicks >= 10) document.getElementById('btn-unban').classList.add('active');
        if (clicks >= 20) document.getElementById('btn-pro').classList.add('active');
    }

    function redeem(type) {
        const price = (type === 'unban') ? 10 : 20;
        if (clicks >= price) {
            // САМАЯ ЖЕСТКАЯ КОМАНДА ПЕРЕХОДА
            const a = document.createElement('a');
            a.href = links[type];
            a.target = '_blank';
            a.click();
            
            // Запасной вариант для приложения
            tg.openLink(links[type]);
        }
    }
</script>
